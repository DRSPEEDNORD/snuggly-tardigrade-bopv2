<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Directives de cache pour les navigateurs -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <script>
      // Script de rafraîchissement automatique intelligent
      (function() {
        const version = "1.0.2"; // Changez ce numéro pour forcer une mise à jour globale
        const storedVersion = localStorage.getItem('dsn_app_version');
        const url = new URL(window.location.href);
        
        // Si la version stockée est différente ou absente, on vide le cache et on reload
        if (storedVersion !== version) {
          localStorage.setItem('dsn_app_version', version);
          
          // Ajoute un paramètre unique à l'URL pour bypasser le cache serveur/proxy
          url.searchParams.set('update', Date.now());
          
          // Nettoyage des anciens Service Workers si présents
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              for(let reg of regs) reg.unregister();
            });
          }
          
          window.location.replace(url.toString());
        }
      })();
    </script>

    <title>DRSPEEDNORD</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
